name: Bootstrap Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: serverless
        run: npm install --no-audit --no-fund

      - name: Create D1 database if needed
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.toml; then
            npx wrangler d1 create music-library > /tmp/d1-create.txt
            cat /tmp/d1-create.txt
            DB_ID="$(grep -Eo 'database_id[[:space:]]*=[[:space:]]*"[^"]+"' /tmp/d1-create.txt | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
            if [ -z "$DB_ID" ]; then
              echo "Could not parse database ID. Copy the ID from the log into serverless/wrangler.toml."
              exit 1
            fi
            sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "Configure Cloudflare D1 database"
            git push
          else
            echo "D1 database already configured."
          fi

      - name: Apply schema
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute music-library --remote --file=./schema.sql
