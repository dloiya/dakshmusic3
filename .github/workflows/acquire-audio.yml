name: Acquire Audio

on:
  workflow_dispatch:
    inputs:
      track_id:
        required: true
        type: string
      job_id:
        required: true
        type: string
      title:
        required: true
        type: string
      artist:
        required: true
        type: string
      album:
        required: false
        type: string
      isrc:
        required: false
        type: string
      source:
        required: false
        type: string
      source_id:
        required: false
        type: string
      source_url:
        required: false
        type: string

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACK_ID: ${{ inputs.track_id }}
      JOB_ID: ${{ inputs.job_id }}
      TITLE: ${{ inputs.title }}
      ARTIST: ${{ inputs.artist }}
      ALBUM: ${{ inputs.album }}
      ISRC: ${{ inputs.isrc }}
      SOURCE: ${{ inputs.source }}
      SOURCE_ID: ${{ inputs.source_id }}
      SOURCE_URL: ${{ inputs.source_url }}
      CALLBACK_URL: ${{ secrets.DAKSH_WORKER_URL }}/api/v1/worker/callback
      CALLBACK_SECRET: ${{ secrets.DAKSH_WORKER_CALLBACK_SECRET }}
      R2_ENDPOINT: ${{ secrets.DAKSH_R2_ENDPOINT }}
      R2_BUCKET: dakshmusic3-audio
      R2_ACCESS_KEY: ${{ secrets.DAKSH_R2_ACCESS_KEY_ID }}
      R2_SECRET_KEY: ${{ secrets.DAKSH_R2_SECRET_ACCESS_KEY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      SPOTIFLAC_REGISTRIES: https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Extension/main/registry.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp boto3 requests spotiflac

      - name: Download and install SpotiFLAC extensions
        shell: bash
        run: |
          set -euo pipefail
          EXT_DIR="$HOME/.spotiflac/extensions"
          mkdir -p "$EXT_DIR"

          REGISTRY_URL="$SPOTIFLAC_REGISTRIES"
          echo "Downloading SpotiFLAC extension registry..."
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "$REGISTRY_URL" -o /tmp/spotiflac-registry.json

          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('/tmp/spotiflac-registry.json').read_text())
          print(json.dumps(registry, indent=2)[:12000])
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('/tmp/spotiflac-registry.json').read_text())
          urls = []

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.lower() in {'url', 'downloadurl', 'download_url', 'artifact', 'artifacturl', 'artifact_url'} and isinstance(child, str):
                          if '.spotiflac-ext' in child or child.endswith(('.zip', '.whl')):
                              urls.append(child)
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(registry)
          urls = list(dict.fromkeys(urls))
          if not urls:
              raise SystemExit('No downloadable SpotiFLAC extensions found in registry')
          Path('/tmp/spotiflac-extension-urls.txt').write_text('\n'.join(urls) + '\n')
          print(f'Found {len(urls)} extension artifacts')
          PY

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            name="${url##*/}"
            echo "Downloading extension: $name"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
              "$url" -o "$EXT_DIR/$name"
          done < /tmp/spotiflac-extension-urls.txt

          echo "Installed SpotiFLAC extension files:"
          find "$EXT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find "$EXT_DIR" -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Verify SpotiFLAC extensions
        shell: bash
        run: |
          set -euo pipefail
          EXT_DIR="$HOME/.spotiflac/extensions"
          echo "SpotiFLAC extension directory: $EXT_DIR"
          find "$EXT_DIR" -maxdepth 1 -type f -ls
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path.home() / '.spotiflac' / 'extensions'
          files = list(p.glob('*'))
          if not files:
              raise SystemExit('SpotiFLAC extension installation produced no files')
          print(f'Verified {len(files)} installed extension artifacts')
          PY

      - name: Acquire and upload
        run: python workers/acquire/acquire.py
