name: Acquire Audio

on:
  workflow_dispatch:
    inputs:
      track_id:
        required: true
        type: string
      job_id:
        required: true
        type: string
      title:
        required: true
        type: string
      artist:
        required: true
        type: string
      album:
        required: false
        type: string
      isrc:
        required: false
        type: string
      source:
        required: false
        type: string
      source_id:
        required: false
        type: string
      source_url:
        required: false
        type: string

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACK_ID: ${{ inputs.track_id }}
      JOB_ID: ${{ inputs.job_id }}
      TITLE: ${{ inputs.title }}
      ARTIST: ${{ inputs.artist }}
      ALBUM: ${{ inputs.album }}
      ISRC: ${{ inputs.isrc }}
      SOURCE: ${{ inputs.source }}
      SOURCE_ID: ${{ inputs.source_id }}
      SOURCE_URL: ${{ inputs.source_url }}
      CALLBACK_URL: ${{ secrets.DAKSH_WORKER_URL }}/api/v1/worker/callback
      CALLBACK_SECRET: ${{ secrets.DAKSH_WORKER_CALLBACK_SECRET }}
      R2_ENDPOINT: ${{ secrets.DAKSH_R2_ENDPOINT }}
      R2_BUCKET: dakshmusic3-audio
      R2_ACCESS_KEY: ${{ secrets.DAKSH_R2_ACCESS_KEY_ID }}
      R2_SECRET_KEY: ${{ secrets.DAKSH_R2_SECRET_ACCESS_KEY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      SPOTIFLAC_REGISTRIES: https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Extension/main/registry.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp boto3 requests spotiflac

      - name: Configure SpotiFLAC extension registry
        shell: bash
        run: |
          set -euo pipefail

          # SpotiFLAC reads this file during initialization. Keep both the
          # process environment and the persistent config file populated.
          printf 'SPOTIFLAC_REGISTRIES=%s\n' "$SPOTIFLAC_REGISTRIES" > "$HOME/.spotiflac_env"
          printf 'SPOTIFLAC_REGISTRIES=%s\n' "$SPOTIFLAC_REGISTRIES" > "$GITHUB_ENV"

          echo "SpotiFLAC registry: $SPOTIFLAC_REGISTRIES"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "$SPOTIFLAC_REGISTRIES" -o /tmp/spotiflac-registry.json

          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('/tmp/spotiflac-registry.json').read_text())
          extensions = registry.get('extensions') or []
          wanted = {'tidal-web', 'qobuz-web', 'amazon'}
          found = {str(x.get('id')) for x in extensions if isinstance(x, dict)}
          print('Registry extensions:', ', '.join(sorted(found)))
          missing = wanted - found
          if missing:
              raise SystemExit(f'Missing required SpotiFLAC extensions from registry: {sorted(missing)}')
          PY

      - name: Preload SpotiFLAC extensions
        shell: bash
        run: |
          set -euo pipefail

          # Trigger the Python module's extension manager once before the
          # acquisition process. The module downloads and caches the matching
          # JS extensions from SPOTIFLAC_REGISTRIES.
          python - <<'PY'
          import asyncio
          import os
          from SpotiFLAC.client import AsyncSpotiFLAC

          async def main():
              print('SPOTIFLAC_REGISTRIES =', os.environ.get('SPOTIFLAC_REGISTRIES'))
              async with AsyncSpotiFLAC(
                  output_dir='/tmp/spotiflac-preload',
                  services=['tidal', 'qobuz', 'amazon'],
                  use_extensions_fallback=True,
              ):
                  print('SpotiFLAC extension manager initialized.')

          asyncio.run(main())
          PY

      - name: Verify extension cache
        shell: bash
        run: |
          set -euo pipefail
          echo "SpotiFLAC cache/config paths:"
          find "$HOME/.spotiflac" "$HOME/.cache/spotiflac" -maxdepth 4 -type f 2>/dev/null | sort | head -200 || true

      - name: Acquire and upload
        run: python workers/acquire/acquire.py
