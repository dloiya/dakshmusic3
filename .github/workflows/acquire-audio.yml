name: Acquire Audio

on:
  workflow_dispatch:
    inputs:
      track_id:
        required: true
        type: string
      job_id:
        required: true
        type: string
      title:
        required: true
        type: string
      artist:
        required: true
        type: string
      album:
        required: false
        type: string
      isrc:
        required: false
        type: string
      source:
        required: false
        type: string
      source_id:
        required: false
        type: string
      source_url:
        required: false
        type: string

permissions:
  contents: read

env:
  SPOTIFLAC_REGISTRIES: https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Extension/main/registry.json

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACK_ID: ${{ inputs.track_id }}
      JOB_ID: ${{ inputs.job_id }}
      TITLE: ${{ inputs.title }}
      ARTIST: ${{ inputs.artist }}
      ALBUM: ${{ inputs.album }}
      ISRC: ${{ inputs.isrc }}
      SOURCE: ${{ inputs.source }}
      SOURCE_ID: ${{ inputs.source_id }}
      SOURCE_URL: ${{ inputs.source_url }}
      CALLBACK_URL: ${{ secrets.DAKSH_WORKER_URL }}/api/v1/worker/callback
      CALLBACK_SECRET: ${{ secrets.DAKSH_WORKER_CALLBACK_SECRET }}
      R2_ENDPOINT: ${{ secrets.DAKSH_R2_ENDPOINT }}
      R2_BUCKET: dakshmusic3-audio
      R2_ACCESS_KEY: ${{ secrets.DAKSH_R2_ACCESS_KEY_ID }}
      R2_SECRET_KEY: ${{ secrets.DAKSH_R2_SECRET_ACCESS_KEY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp boto3 requests spotiflac

      - name: Configure SpotiFLAC registry
        shell: bash
        run: |
          set -euo pipefail
          printf 'SPOTIFLAC_REGISTRIES=%s\n' "$SPOTIFLAC_REGISTRIES" > "$HOME/.spotiflac_env"
          echo "SPOTIFLAC_REGISTRIES=$SPOTIFLAC_REGISTRIES" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "$SPOTIFLAC_REGISTRIES" -o /tmp/spotiflac-registry.json

      - name: Install SpotiFLAC download extensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from SpotiFLAC.extensions.manager import ExtensionManager

          registry = os.environ["SPOTIFLAC_REGISTRIES"]
          manager = ExtensionManager(auto_install_downloads=False)
          print(f"Installing SpotiFLAC extensions from: {registry}")

          entries = manager.fetch_registry(registry)
          targets = {
              e.id: e for e in entries
              if e.id in {"tidal-web", "qobuz-web", "amazon"}
          }
          print("Registry targets:", sorted(targets))

          missing = {"tidal-web", "qobuz-web", "amazon"} - set(targets)
          if missing:
              raise RuntimeError(f"Required extensions missing from registry: {sorted(missing)}")

          for name in ("tidal-web", "qobuz-web", "amazon"):
              entry = targets[name]
              installed = manager.get_installed(name)
              if installed and installed.version == entry.version:
                  print(f"Already installed: {name} v{installed.version}")
                  continue
              print(f"Downloading/installing: {name} v{entry.version}")
              manager.install_from_url(entry.download_url, sha256=entry.sha256)

          installed = manager.get_installed()
          print("Installed extensions:")
          for ext in installed:
              print(f"  - {ext.name} v{ext.version} [{ext.ext_dir}]")

          installed_names = {ext.name for ext in installed}
          required = {"tidal-web", "qobuz-web", "amazon"}
          missing = required - installed_names
          if missing:
              raise RuntimeError(f"Extension installation verification failed: {sorted(missing)}")
          PY

      - name: Verify SpotiFLAC extension files
        shell: bash
        run: |
          set -euo pipefail
          for ext in tidal-web qobuz-web amazon; do
            dir="$HOME/.spotiflac/extensions/$ext"
            test -f "$dir/manifest.json" || { echo "Missing $dir/manifest.json"; exit 1; }
            echo "Verified $ext:"
            find "$dir" -maxdepth 2 -type f -printf '  %p\n' | sort
          done

      - name: Acquire and upload
        run: python workers/acquire/acquire.py
