name: Acquire Audio

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      source_url:
        required: true
        type: string
      title:
        required: true
        type: string
      artist:
        required: true
        type: string
      album:
        required: false
        type: string
      duration_ms:
        required: true
        type: string

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3 python3-pip
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user -r providers/requirements.txt

      - name: Acquire and verify audio
        id: acquire
        env:
          AUDIO_SOURCE_URL: ${{ inputs.source_url }}
          AUDIO_TITLE: ${{ inputs.title }}
          AUDIO_ARTIST: ${{ inputs.artist }}
          AUDIO_ALBUM: ${{ inputs.album }}
          AUDIO_DURATION_MS: ${{ inputs.duration_ms }}
          AUDIO_OUTPUT: /tmp/output.flac
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -uo pipefail
          chmod +x providers/primary.sh providers/fallback.sh

          verify() {
            python3 providers/validate_audio.py /tmp/output.flac
          }

          MAX_ATTEMPTS=3
          success=0

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=================================================="
            echo "Acquisition worker attempt $attempt/$MAX_ATTEMPTS"
            echo "Requested: $AUDIO_TITLE — $AUDIO_ARTIST"
            echo "Expected duration: ${AUDIO_DURATION_MS}ms"
            echo "=================================================="

            rm -f /tmp/output.flac

            if providers/primary.sh && test -s /tmp/output.flac; then
              echo "Primary provider produced audio; validating recording identity..."
              if verify; then
                echo "provider=primary" >> "$GITHUB_OUTPUT"
                success=1
                break
              fi
              echo "VALIDATION FAILED: primary provider returned the wrong recording."
              rm -f /tmp/output.flac
            else
              echo "Primary provider failed; continuing to fallback provider."
              rm -f /tmp/output.flac
            fi

            if providers/fallback.sh && test -s /tmp/output.flac; then
              echo "Fallback provider produced audio; validating recording identity..."
              if verify; then
                echo "provider=fallback" >> "$GITHUB_OUTPUT"
                success=1
                break
              fi
              echo "VALIDATION FAILED: fallback provider returned the wrong recording."
              rm -f /tmp/output.flac
            else
              echo "Fallback provider failed."
              rm -f /tmp/output.flac
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Validation/acquisition failed. Re-running the acquisition worker in 5 seconds..."
              sleep 5
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: No provider produced a metadata-verified recording after $MAX_ATTEMPTS worker attempts."
            exit 1
          fi

          test -s /tmp/output.flac
          file /tmp/output.flac

      - name: Upload to R2 and complete job
        env:
          JOB_ID: ${{ inputs.job_id }}
          PROVIDER: ${{ steps.acquire.outputs.provider }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          python3 .github/scripts/upload_r2.py /tmp/output.flac

      - name: Report failure
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          curl -sS -X POST "$WORKER_BASE_URL/api/v1/jobs/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"failed\",\"error\":\"Workflow run failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          || true
