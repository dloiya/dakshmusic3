name: Deploy Music Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: serverless
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          echo "Cloudflare credentials are available"

      - name: Inspect production D1 schema and migration history
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '--- D1 migration history ---'
          npx wrangler d1 migrations list dakshmusic3 --remote
          echo '--- Production schema ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"
          echo '--- Tracks columns ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "PRAGMA table_info(tracks);"
          echo '--- Playlist entries columns ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "PRAGMA table_info(playlist_entries);"

      - name: Apply D1 migrations
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dakshmusic3 --remote

      - name: Deploy Worker + Frontend
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
