name: Deploy Music Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good Worker entry router
        run: |
          set -euo pipefail
          git fetch origin bd1bef276c2a53150702dd963983fd3198868f4e --depth=1
          git checkout bd1bef276c2a53150702dd963983fd3198868f4e -- serverless/entry.js

      - name: Add acquisition API and repair acquisition status UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          entry = Path('serverless/entry.js')
          s = entry.read_text()

          if 'async function listAcquisitions(env, req)' not in s:
              marker = 'export default {'
              if marker not in s:
                  raise SystemExit('entry.js export marker not found')

              helpers = r'''
          async function listAcquisitions(env, req) {
            if (!(await requireAuth(env, req))) {
              return json({ error: "Authentication required" }, 401);
            }

            const url = new URL(req.url);
            const limit = Math.min(200, Math.max(1, Number(url.searchParams.get("limit") || 100)));
            const status = url.searchParams.get("status");

            const sql = status
              ? `SELECT j.id AS job_id,j.track_id,j.kind,j.status,j.provider,j.drive_file_id,j.format,j.mime_type,j.error,j.created_at,j.updated_at,t.title,t.artist,t.album,t.artwork_url,t.duration_ms,t.source,t.source_url FROM download_jobs j LEFT JOIN tracks t ON t.id=j.track_id WHERE j.status=? ORDER BY datetime(j.created_at) DESC LIMIT ?`
              : `SELECT j.id AS job_id,j.track_id,j.kind,j.status,j.provider,j.drive_file_id,j.format,j.mime_type,j.error,j.created_at,j.updated_at,t.title,t.artist,t.album,t.artwork_url,t.duration_ms,t.source,t.source_url FROM download_jobs j LEFT JOIN tracks t ON t.id=j.track_id ORDER BY datetime(j.created_at) DESC LIMIT ?`;

            const result = status
              ? await env.DB.prepare(sql).bind(status, limit).all()
              : await env.DB.prepare(sql).bind(limit).all();

            return json({ items: result.results || [], limit });
          }

          async function acquisitionSummary(env, req) {
            if (!(await requireAuth(env, req))) {
              return json({ error: "Authentication required" }, 401);
            }

            const result = await env.DB.prepare(
              `SELECT status,COUNT(*) AS count FROM download_jobs GROUP BY status`
            ).all();

            const counts = {};
            for (const row of result.results || []) {
              counts[row.status] = Number(row.count || 0);
            }

            return json({
              counts,
              active: (counts.queued || 0) + (counts.dispatched || 0) + (counts.running || 0),
            });
          }

          '''
              s = s.replace(marker, helpers + marker, 1)

          route_marker = '    const path = url.pathname;'
          route_insert = '''    const path = url.pathname;

    if ((path === "/api/v1/acquisitions" || path === "/api/v1/jobs") && req.method === "GET") {
      return listAcquisitions(env, req);
    }

    if (path === "/api/v1/acquisitions/summary" && req.method === "GET") {
      return acquisitionSummary(env, req);
    }'''

          if 'path === "/api/v1/acquisitions"' not in s:
              if route_marker not in s:
                  raise SystemExit('entry.js path marker not found')
              s = s.replace(route_marker, route_insert, 1)

          entry.write_text(s)

          ui = Path('frontend/playlist-ui.js')
          u = ui.read_text()
          u = u.replace('`${API}/jobs/status`', '`${API}/acquisitions?limit=100`')
          u = u.replace('const jobs = data.jobs || [];', 'const jobs = Array.isArray(data) ? data : (data.items || []);')
          ui.write_text(u)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serverless/entry.js frontend/playlist-ui.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix acquisition status API and UI"
            git push origin HEAD:main
          else
            echo "Acquisition API and UI already current"
          fi

      - name: Verify Worker and acquisition UI
        run: |
          set -euo pipefail
          grep -q "async function dispatchWarm" serverless/entry.js
          grep -q "async function appleImport" serverless/entry.js
          grep -q "async function listAcquisitions" serverless/entry.js
          grep -q '/api/v1/acquisitions' frontend/playlist-ui.js
          echo "Worker router and acquisition status UI verified"

      - name: Install Wrangler
        working-directory: serverless
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          echo "Cloudflare credentials are available"

      - name: Inspect and reconcile production D1 migration history
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list dakshmusic3 --remote
          npx wrangler d1 execute dakshmusic3 --remote --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"
          npx wrangler d1 execute dakshmusic3 --remote --command "
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_add_track_isrc.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_track_natural_key.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '003_track_natural_key.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '005_reconcile_existing_schema.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc') AND EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
          "
          npx wrangler d1 migrations list dakshmusic3 --remote

      - name: Apply D1 migrations
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dakshmusic3 --remote

      - name: Deploy Worker + Frontend
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
