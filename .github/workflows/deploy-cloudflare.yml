name: Deploy Music Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backfill Apple duration resolution in acquisition code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('serverless/entry.js')
          s = p.read_text()
          old = '''  if (!env.GITHUB_TOKEN || !env.GITHUB_OWNER || !env.GITHUB_REPO) throw new Error("GitHub Actions dispatch is not configured");
          if (!track.duration_ms) throw new Error(`Track ${track.natural_key || trackId} has no canonical duration_ms; refusing acquisition without identity data`);'''
          new = '''  if (!env.GITHUB_TOKEN || !env.GITHUB_OWNER || !env.GITHUB_REPO) throw new Error("GitHub Actions dispatch is not configured");

          // Apple imports may lack duration_ms. Resolve the canonical catalog
          // duration before dispatch so strict identity validation remains intact.
          if (!track.duration_ms && String(track.source || '').toLowerCase() === 'apple' && track.source_id) {
            try {
              const lookup = await fetch(`https://itunes.apple.com/lookup?id=${encodeURIComponent(track.source_id)}&entity=song`);
              if (lookup.ok) {
                const data = await lookup.json();
                const song = (data.results || []).find(x => x.wrapperType === 'track' && x.trackTimeMillis);
                if (song?.trackTimeMillis) {
                  track.duration_ms = Number(song.trackTimeMillis);
                  await env.DB.prepare(`UPDATE tracks SET duration_ms=? WHERE id=? AND (duration_ms IS NULL OR duration_ms=0)`).bind(track.duration_ms, trackId).run();
                }
              }
            } catch (e) {
              console.warn('Apple duration lookup failed', track.source_id, e);
            }
          }

          if (!track.duration_ms) throw new Error(`Track ${track.natural_key || trackId} has no canonical duration_ms; refusing acquisition without identity data`);'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Applied Apple duration backfill patch')
          elif 'Apple imports may lack duration_ms.' in s:
              print('Apple duration backfill already present')
          else:
              raise SystemExit('Acquisition duration guard not found')
          PY

      - name: Install Wrangler
        working-directory: serverless
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          echo "Cloudflare credentials are available"

      - name: Inspect and reconcile production D1 migration history
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '--- D1 migration history before reconciliation ---'
          npx wrangler d1 migrations list dakshmusic3 --remote

          echo '--- Production schema ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"

          echo '--- Reconcile migrations whose schema changes already exist ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_add_track_isrc.sql'
              WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_track_natural_key.sql'
              WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '003_track_natural_key.sql'
              WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
            INSERT OR IGNORE INTO d1_migrations(name) SELECT '005_reconcile_existing_schema.sql'
              WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc')
                AND EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');
          "

          echo '--- D1 migration history after reconciliation ---'
          npx wrangler d1 migrations list dakshmusic3 --remote

      - name: Apply D1 migrations
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dakshmusic3 --remote

      - name: Deploy Worker + Frontend
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
