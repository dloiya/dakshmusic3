name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Build frontend
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

      - name: Validate Worker configuration
        run: uv run pywrangler check

      - name: Apply remote D1 migrations
        run: uv run pywrangler d1 migrations apply dakshmusic3 --remote

      - name: Deploy Worker
        run: uv run pywrangler deploy

      - name: Smoke test production
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_BASE_URL/health"
