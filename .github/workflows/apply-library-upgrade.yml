name: Apply Library Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Add one-shot library upgrade patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted source changes
        run: python3 scripts/apply_library_upgrade.py
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serverless/entry.js serverless/worker.js frontend/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Expand cache to 200 and disable play count increments"
          git push
