name: Patch Playlist UI 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and clean up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html'); s=p.read_text(encoding='utf-8')
          old='<script src="app.js"></script>'
          if 'playlist-ui.js' not in s:
              if old not in s: raise SystemExit('app.js script tag not found')
              p.write_text(s.replace(old, old+'\n<script src="playlist-ui.js"></script>',1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'Load playlist UI enhancements'
          git rm .github/workflows/patch-playlist-ui.yml .github/workflows/patch-playlist-ui2.yml .github/workflows/patch-playlist-ui3.yml frontend/.ui-patch-trigger UI_PATCH_TRIGGER.txt 2>/dev/null || true
          git commit -m 'Remove temporary playlist UI patch workflows' || true
          git push
