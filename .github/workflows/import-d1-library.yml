name: Import Library to D1

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'SQL file path in the repository'
        required: true
        default: 'imports/library_d1_import_fixed.sql'
        type: string
      confirm:
        description: 'Type IMPORT to confirm production D1 import'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  import:
    if: ${{ inputs.confirm == 'IMPORT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SQL file
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ inputs.sql_file }}"
          test -f "$FILE"
          echo "SQL file: $FILE"
          echo "Size: $(du -h "$FILE" | cut -f1)"
          if grep -q 'ON CONFLICT(isrc)' "$FILE"; then
            echo 'ERROR: unsupported ON CONFLICT(isrc) remains'
            exit 1
          fi
          if grep -Eq '^BEGIN( TRANSACTION)?;|^COMMIT;' "$FILE"; then
            echo 'INFO: transaction statements found; they will be removed before D1 execution.'
          fi

      # Do not enable npm caching here: this repository intentionally has no
      # package-lock.json/yarn.lock, and Wrangler is installed globally below.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Prepare D1 SQL
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ inputs.sql_file }}"
          # D1 execution must not receive explicit SQLite transaction-control
          # statements. D1 handles each statement safely at the database layer.
          sed -E '/^[[:space:]]*BEGIN( TRANSACTION)?;[[:space:]]*$/d; /^[[:space:]]*COMMIT;[[:space:]]*$/d' "$FILE" > /tmp/dakshmusic3_d1_import.sql
          echo "Prepared SQL size: $(du -h /tmp/dakshmusic3_d1_import.sql | cut -f1)"
          if grep -Eq '^BEGIN( TRANSACTION)?;|^COMMIT;' /tmp/dakshmusic3_d1_import.sql; then
            echo 'ERROR: transaction statements remain after preparation'
            exit 1
          fi

      - name: Import into production D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute dakshmusic3 --remote --file=/tmp/dakshmusic3_d1_import.sql
