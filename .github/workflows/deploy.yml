name: Deploy Music Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enrich seed metadata logic
        run: |
          set -euo pipefail
          python3 scripts/enrich_seed_metadata.py

      - name: Verify consolidated acquisition, seed metadata, routing, and UI
        run: |
          set -euo pipefail
          grep -q 'handleLibraryV3' serverless/app_v2.js
          grep -q 'backfillMissingMetadata' serverless/app_v2.js
          grep -q 'async function seed' serverless/library.js
          grep -q 'isTopCacheRow' serverless/library.js
          grep -q 'duration_ms' serverless/library.js
          grep -q 'artwork_url' serverless/library.js
          grep -q 'handleAcquisitionRoute' serverless/entry.js
          grep -q 'api/v1/acquisitions' serverless/entry.js
          grep -q 'api/v1/acquisitions/summary' serverless/entry.js
          grep -q '/acquisitions?limit=' frontend/playlist-ui.js
          grep -qE 'tracks/[^[:space:]]*/acquire' serverless/acquisition_route.js
          echo "Consolidated acquisition, seed metadata, duration, library routing, and UI verified"

      - name: Install Wrangler
        working-directory: serverless
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          echo "Cloudflare credentials are available"

      - name: Inspect and reconcile production D1 migration history
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '--- D1 migration history before reconciliation ---'
          npx wrangler d1 migrations list dakshmusic3 --remote

          echo '--- Production schema ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"

          echo '--- Reconcile migrations whose schema changes already exist ---'
          npx wrangler d1 execute dakshmusic3 --remote --command "INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_add_track_isrc.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc'); INSERT OR IGNORE INTO d1_migrations(name) SELECT '002_track_natural_key.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key'); INSERT OR IGNORE INTO d1_migrations(name) SELECT '003_track_natural_key.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key'); INSERT OR IGNORE INTO d1_migrations(name) SELECT '005_reconcile_existing_schema.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'isrc') AND EXISTS (SELECT 1 FROM pragma_table_info('tracks') WHERE name = 'natural_key');"

          echo '--- D1 migration history after reconciliation ---'
          npx wrangler d1 migrations list dakshmusic3 --remote

      - name: Apply D1 migrations
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dakshmusic3 --remote

      - name: Deploy Worker + Frontend
        working-directory: serverless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
