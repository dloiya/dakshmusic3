name: Validate dakshmusic3 v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate FastAPI backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall -q backend/app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package.json

      - name: Build React frontend
        working-directory: frontend-react
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate canonical D1 schema
        run: |
          python - <<'PY'
          from pathlib import Path
          schema = Path("db/schema.sql").read_text()
          required = [
              "tracks", "albums", "playlist_entries", "queue_entries",
              "queue_state", "acquisition_jobs", "cache_objects",
              "sessions", "import_jobs",
          ]
          missing = [name for name in required if f"CREATE TABLE {name}" not in schema]
          if missing:
              raise SystemExit(f"Missing schema tables: {missing}")
          print("Canonical v2 D1 schema verified")
          PY

      - name: Verify v2 structure
        run: |
          test -f backend/app/main.py
          test -f backend/app/api/status.py
          test -f backend/app/services/acquisition/status.py
          test -f backend/app/connectors/cloudflare/d1.py
          test -f backend/app/connectors/cloudflare/r2.py
          test -f frontend-react/src/App.jsx
          test -f db/schema.sql
          echo "dakshmusic3 v2 structure verified"

      # Production deployment is intentionally disabled while the FastAPI
      # runtime target is being established. The legacy Worker must not touch
      # the freshly recreated D1 database.
