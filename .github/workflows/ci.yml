name: V2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run python -m compileall -q backend/app backend/entry.py
      - run: uv run pywrangler --help > /dev/null

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile workers/acquire/acquire.py workers/acquire/resolve_apple.py
      - run: pip install pyyaml --quiet
      - run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('Workflow YAML valid')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate D1 schema
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          db.executescript(open('db/schema.sql', encoding='utf-8').read())
          tables = {r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          required = {'tracks','albums','playlist_entries','queue_entries','queue_state','acquisition_jobs','cache_objects','sessions','import_jobs'}
          missing = required - tables
          if missing:
              raise SystemExit(f'missing tables: {sorted(missing)}')
          print('D1 schema valid')
          PY
