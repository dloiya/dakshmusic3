name: Apply Playlist Queue Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply playlist queue and source URL fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # app.js: expose the existing player queue to playlist-ui and make
          # the Queue screen use a search-result queue when one is active.
          p = Path('frontend/app.js')
          s = p.read_text()
          old = '''  async function openQueue() {\n    const s = { key: "queue", title: "Queue", kind: "menu", selected: 0, items: [], emptyText: "" };\n    push(s);\n    try {\n      const rows = await getPlaylist();\n      playlistCache = rows;\n      const items = [{ html: miniPlayerHtml(), action: () => push(nowPlayingScreen()) }];\n      let upNext = rows;\n      if (nowPlayingTrack) {\n        const idx = rows.findIndex(t => t.id === nowPlayingTrack.id);\n        upNext = idx >= 0 ? rows.slice(idx + 1) : rows;\n      }\n'''
          new = '''  async function openQueue() {\n    const s = { key: "queue", title: "Queue", kind: "menu", selected: 0, items: [], emptyText: "" };\n    push(s);\n    try {\n      const searchQueue = nowPlayingMode === "playlist" && Array.isArray(nowPlayingList) && nowPlayingList.length ? nowPlayingList : null;\n      const rows = searchQueue || await getPlaylist();\n      playlistCache = rows;\n      const items = [{ html: miniPlayerHtml(), action: () => push(nowPlayingScreen()) }];\n      let upNext = rows;\n      if (nowPlayingTrack) {\n        const idx = rows.findIndex(t => t.id === nowPlayingTrack.id);\n        upNext = idx >= 0 ? rows.slice(idx + 1) : rows;\n      }\n'''
          if old not in s:
              raise SystemExit('app.js queue block not found')
          s = s.replace(old, new, 1)
          marker = '''  function playTrack(track, listContext, mode = null) {\n'''
          expose = '''  // Playlist search uses the same player queue as the iPod Queue screen.\n  // This keeps search results ephemeral: they become the playback queue without\n  // modifying the persisted playlist.\n  window.__setPlaylistSearchQueue = (tracks) => {\n    const queue = Array.isArray(tracks) ? tracks.filter(t => t && (t.id != null || t.track_id != null)) : [];\n    if (!queue.length) return;\n    playTrack(queue[0], queue, "playlist");\n    toast(`${queue.length} search result${queue.length === 1 ? "" : "s"} queued`);\n  };\n\n'''
          if expose not in s:
              s = s.replace(marker, expose + marker, 1)
          p.write_text(s)

          # playlist-ui: clicking a search result replaces the playback queue
          # with the entire filtered result set and starts at the clicked row.
          p = Path('frontend/playlist-ui.js')
          s = p.read_text()
          old = '''  function play(t) {\n    if (!t?.id && !t?.track_id) return;\n    const id = t.id ?? t.track_id;\n    audio.src = `${API}/playback/${encodeURIComponent(id)}`;\n    audio.play().catch(() => {});\n    const title = document.getElementById("screenTitle");\n    if (title) title.textContent = t.title || "Now Playing";\n  }\n'''
          new = '''  function play(t, list = filtered()) {\n    if (!t?.id && !t?.track_id) return;\n    if (typeof window.__setPlaylistSearchQueue === "function") {\n      const queue = Array.isArray(list) ? list : [t];\n      const start = queue.findIndex(x => (x.id ?? x.track_id) === (t.id ?? t.track_id));\n      const ordered = start > 0 ? queue.slice(start).concat(queue.slice(0, start)) : queue;\n      window.__setPlaylistSearchQueue(ordered);\n      return;\n    }\n    const id = t.id ?? t.track_id;\n    audio.src = `${API}/playback/${encodeURIComponent(id)}`;\n    audio.play().catch(() => {});\n  }\n'''
          if old not in s:
              raise SystemExit('playlist-ui play block not found')
          s = s.replace(old, new, 1)
          old = '''      li.addEventListener("click", () => play(list[Number(li.dataset.playIndex)]));\n'''
          new = '''      li.addEventListener("click", () => play(list[Number(li.dataset.playIndex)], list));\n'''
          if old not in s:
              raise SystemExit('playlist-ui click block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # library_v2: every Apple-library track gets a real Apple Music URL
          # derived from its Apple catalog id. Existing rows are backfilled too.
          p = Path('serverless/library_v2.js')
          s = p.read_text()
          old = '''      const sourceId = x.source_id ? `apple:${String(x.source_id)}` : null;\n      return env.DB.prepare(`INSERT OR IGNORE INTO tracks(source,source_id,source_url,title,artist,album,duration_ms,isrc,artwork_url,natural_key,play_count) VALUES('apple',?,?,?,?,?,?,?,?,?,0)`)\n        .bind(sourceId, x.source_url || null, x.title, x.artist || "", x.album || null, Number(x.duration_ms) || null, x.isrc || null, x.artwork_url || null, naturalKey(x, offset + i));\n'''
          new = '''      const sourceId = x.source_id ? `apple:${String(x.source_id)}` : null;\n      const sourceUrl = x.source_url || (x.source_id ? `https://music.apple.com/us/song/${slug(x.title)}/${String(x.source_id)}` : null);\n      return env.DB.prepare(`INSERT OR IGNORE INTO tracks(source,source_id,source_url,title,artist,album,duration_ms,isrc,artwork_url,natural_key,play_count) VALUES('apple',?,?,?,?,?,?,?,?,?,0)`)\n        .bind(sourceId, sourceUrl, x.title, x.artist || "", x.album || null, Number(x.duration_ms) || null, x.isrc || null, x.artwork_url || null, naturalKey(x, offset + i));\n'''
          if old not in s:
              raise SystemExit('library_v2 insert block not found')
          s = s.replace(old, new, 1)
          marker = '''  const playlistRows = [];\n'''
          backfill = '''  // Older seeds created Apple tracks without source_url. Backfill those rows\n  // from the canonical Apple catalog id so acquisition has a resolvable source.\n  const { results: sourceRows = [] } = await env.DB.prepare(`SELECT id,source_id,title FROM tracks WHERE source='apple' AND (source_url IS NULL OR source_url='') AND source_id IS NOT NULL`).all();\n  if (sourceRows.length) {\n    for (let offset = 0; offset < sourceRows.length; offset += 100) {\n      const chunk = sourceRows.slice(offset, offset + 100);\n      await env.DB.batch(chunk.map(t => env.DB.prepare(`UPDATE tracks SET source_url=? WHERE id=?`).bind(`https://music.apple.com/us/song/${slug(t.title)}/${String(t.source_id).replace(/^apple:/, '')}`, t.id)));\n    }\n  }\n\n'''
          if backfill not in s:
              s = s.replace(marker, backfill + marker, 1)
          p.write_text(s)
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/playlist-ui.js serverless/library_v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply playlist queue and source URL fixes"
          git push

      - name: Remove one-shot patch workflow
        if: success()
        run: |
          git rm .github/workflows/apply-playlist-queue-fix.yml
          git commit -m "Remove one-shot playlist queue fix workflow"
          git push
