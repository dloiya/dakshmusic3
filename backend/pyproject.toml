[project]
name = "dakshmusic3"
version = "2.0.0"
description = "dakshmusic3 FastAPI backend on Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["workers-py"]
