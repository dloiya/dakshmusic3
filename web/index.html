<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DakshMusic</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#111;color:#eee}input,button{padding:12px;font:inherit;margin:4px}input{width:min(700px,90%)}pre{white-space:pre-wrap;background:#1b1b1b;padding:16px;border-radius:10px}.ok{color:#7f7}.warn{color:#fc6}</style><h1>🎵 DakshMusic</h1><p>Browser-powered acquisition queue</p><input id="url" placeholder="Paste a track, album or playlist URL"><button id="add">Queue</button><button id="toggle">Enable browser worker</button><p id="state">Worker idle</p><pre id="log"></pre><script type="module">const API=localStorage.getItem('dakshmusic_api')||'/api',id=localStorage.dakshmusic_browser_id||(localStorage.dakshmusic_browser_id=crypto.randomUUID()),log=document.querySelector('#log'),state=document.querySelector('#state');let enabled=false,busy=false;const say=x=>log.textContent=new Date().toLocaleTimeString()+' '+x+'\n'+log.textContent;async function api(p,o={}){const r=await fetch(API+p,{headers:{'content-type':'application/json'},...o});const x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}document.querySelector('#add').onclick=async()=>{const url=document.querySelector('#url').value.trim();if(!url)return;const j=await api('/jobs',{method:'POST',body:JSON.stringify({url})});say('Queued '+j.id);document.querySelector('#url').value=''};document.querySelector('#toggle').onclick=()=>{enabled=!enabled;document.querySelector('#toggle').textContent=enabled?'Disable browser worker':'Enable browser worker';state.textContent=enabled?'🟢 Browser worker online':'Worker idle';if(enabled)tick()};async function acquire(job){say('Claimed '+job.id);/* Source acquisition is intentionally isolated here. Next provider implementations plug into this function. */throw Error('No browser acquisition provider installed yet')}async function tick(){if(!enabled||busy)return;busy=true;try{const x=await api('/jobs/claim',{method:'POST',body:JSON.stringify({browser_id:id})});if(x.job){try{const result=await acquire(x.job);await api(`/jobs/${x.job.id}/complete`,{method:'POST',body:JSON.stringify(result)});say('Completed '+x.job.id)}catch(e){await api(`/jobs/${x.job.id}/fail`,{method:'POST',body:JSON.stringify({error:e.message})});say('Failed '+x.job.id+': '+e.message)}}}catch(e){say('Coordinator error: '+e.message)}finally{busy=false;if(enabled)setTimeout(tick,3000)}}</script>
