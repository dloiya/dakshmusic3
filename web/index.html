<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DakshMusic</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#111;color:#eee}input,button{padding:12px;font:inherit;margin:4px}input{width:min(700px,90%)}pre{white-space:pre-wrap;background:#1b1b1b;padding:16px;border-radius:10px}.ok{color:#7f7}.warn{color:#fc6}</style><h1>🎵 DakshMusic</h1><p>Browser-powered acquisition queue → R2</p><input id="url" placeholder="Paste a source URL"><button id="add">Queue</button><button id="toggle">Enable browser worker</button><p id="state">Worker idle</p><pre id="log"></pre><script type="module">import{processAudio,sha256}from'./audio.js';const API=localStorage.getItem('dakshmusic_api')||'/api',id=localStorage.dakshmusic_browser_id||(localStorage.dakshmusic_browser_id=crypto.randomUUID()),log=document.querySelector('#log'),state=document.querySelector('#state');let enabled=false,busy=false;const say=x=>log.textContent=new Date().toLocaleTimeString()+' '+x+'\n'+log.textContent;async function api(p,o={}){const r=await fetch(API+p,{headers:{'content-type':'application/json',...(o.headers||{})},...o});const x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}document.querySelector('#add').onclick=async()=>{const url=document.querySelector('#url').value.trim();if(!url)return;const j=await api('/jobs',{method:'POST',body:JSON.stringify({url})});say('Queued '+j.id);document.querySelector('#url').value=''};document.querySelector('#toggle').onclick=()=>{enabled=!enabled;document.querySelector('#toggle').textContent=enabled?'Disable browser worker':'Enable browser worker';state.textContent=enabled?'🟢 Browser worker online':'Worker idle';if(enabled)tick()};async function acquire(job){say('Claimed '+job.id);const worker=new Worker('./acquisition.worker.js',{type:'module'});const raw=await new Promise((resolve,reject)=>{worker.onmessage=e=>{if(e.data.type==='progress')say('Job '+job.id+': '+e.data.stage);if(e.data.type==='result')resolve(e.data);if(e.data.type==='error')reject(Error(e.data.error))};worker.onerror=e=>reject(Error(e.message));worker.postMessage({type:'acquire',job})});worker.terminate();say('Processing audio');const flac=await processAudio(raw.blob,{onProgress:s=>say('Job '+job.id+': '+s)});say('Hashing '+(flac.size/1048576).toFixed(1)+' MB');const hash=await sha256(flac);say('Requesting R2 upload URL');const up=await api(`/jobs/${job.id}/upload`,{method:'POST',body:JSON.stringify({browser_id:id,size_bytes:flac.size,sha256:hash})});say('Uploading to R2');const put=await fetch(up.url,{method:'PUT',headers:{'Content-Type':up.content_type},body:flac});if(!put.ok)throw Error('R2 upload failed: '+put.status);say('R2 upload complete');return{storage_key:up.key,size_bytes:flac.size,sha256:hash}}async function tick(){if(!enabled||busy)return;busy=true;try{const x=await api('/jobs/claim',{method:'POST',body:JSON.stringify({browser_id:id})});if(x.job){try{const result=await acquire(x.job);await api(`/jobs/${x.job.id}/complete`,{method:'POST',body:JSON.stringify(result)});say('Completed '+x.job.id)}catch(e){await api(`/jobs/${x.job.id}/fail`,{method:'POST',body:JSON.stringify({error:e.message})});say('Failed '+x.job.id+': '+e.message)}}}catch(e){say('Coordinator error: '+e.message)}finally{busy=false;if(enabled)setTimeout(tick,3000)}}</script>
