<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DakshMusic</title><style>body{font:16px system-ui;margin:0;background:#0b0b0d;color:#eee}main{max-width:900px;margin:50px auto;padding:20px}input,button{padding:12px;border-radius:8px;border:1px solid #444;background:#151519;color:#fff}input{width:min(650px,70vw)}button{cursor:pointer}.row{display:flex;gap:8px}.job{padding:14px 0;border-bottom:1px solid #29292d}.muted{color:#999}.ok{color:#8fda9b}</style></head><body><main><h1>DakshMusic</h1><p class="muted">Add a track URL. Oracle handles acquisition; FLAC is stored in R2.</p><form id="add" class="row"><input id="url" required placeholder="Spotify / Deezer / YouTube URL"><button>Add</button></form><h2>Queue</h2><section id="queue">Loading…</section></main><script>
const q=document.querySelector('#queue'); const api=p=>'/api'+p;
async function refresh(){const r=await fetch(api('/jobs'));const d=await r.json();q.innerHTML=(d.jobs||[]).map(j=>`<div class="job"><b>${esc(j.title||'Pending acquisition')}</b> — ${esc(j.artist||'Unknown')}<br><span class="muted">${esc(j.source||'unknown')} · ${j.status} · attempt ${j.attempts}</span>${j.error?`<br><small>${esc(j.error)}</small>`:''}</div>`).join('')||'<p class="muted">Queue is empty.</p>'}
document.querySelector('#add').onsubmit=async e=>{e.preventDefault();const u=document.querySelector('#url');const r=await fetch(api('/jobs'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u.value})});const d=await r.json();if(!r.ok)alert(d.error||'Failed');else{u.value='';refresh()}};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} refresh();setInterval(refresh,3000);
</script></body></html>
